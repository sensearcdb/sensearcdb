[workspace]
resolver = "2"
members = [
    "crates/sensearcdb-common",
    "crates/sensearcdb-engine",
    "crates/sensearcdb-schema",
    "crates/sensearcdb-snapshot",
    "crates/sensearcdb-partition",
    "crates/sensearcdb-cq",
    "crates/sensearcdb-stream",
    "crates/sensearcdb-derived",
    "crates/sensearcdb-bench",
    "crates/sensearcdb-observe",
    "crates/sensearcdb-deploy",
    "crates/sensearcdb-ingest",
    "crates/sensearcdb-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sensearcdb/sensearcdb"

[workspace.dependencies]
# ─── 异步运行时 ───
tokio = { version = "1.35", features = ["full"] }

# ─── 序列化 ───
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "=1.3.3"

# ─── 错误处理 ───
thiserror = "1.0"
anyhow = "1.0"

# ─── 日志与可观测性 ───
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
tracing-appender = "0.2"
once_cell = "1.19"
fastrand = "2.0"

# ─── 压缩 ───
lz4 = "1.24"
zstd = "0.13"

# ─── 校验 ───
crc32c = "0.6"

# ─── 并发与同步 ───
parking_lot = "0.12"
dashmap = "5.5"
arc-swap = "1.7"
rayon = "1.10"

# ─── 字节缓冲 ───
bytes = "1.6"

# ─── 列式 / Arrow ───
arrow = "51.0"
arrow-flight = "51.0"

# ─── SQL 解析 ───
sqlparser = "0.44"

# ─── SQLite ───
rusqlite = { version = "0.31", features = ["bundled"] }

# ─── gRPC ───
tonic = { version = "0.11", features = ["tls"] }
prost = "0.12"
tonic-build = "0.11"

# ─── HTTP / REST ───
axum = "0.7"
tower = "0.4"
tower-http = "0.5"

# ─── 配置管理 ───
config = "0.14"

# ─── 杂项 ───
uuid = { version = "1.8", features = ["serde", "v4"] }
fxhash = "0.2"
num_cpus = "1.16"
regex = "1.10"
chrono = "=0.4.39"
tokio-stream = "0.1"
async-trait = "0.1"

# ─── 部署 / 进程管理 ───
fs2 = "0.4"
x509-parser = "0.16"

# ─── 内部 crate ───
sensearcdb-common = { path = "crates/sensearcdb-common" }
sensearcdb-engine = { path = "crates/sensearcdb-engine" }
sensearcdb-schema = { path = "crates/sensearcdb-schema" }
sensearcdb-snapshot = { path = "crates/sensearcdb-snapshot" }
sensearcdb-partition = { path = "crates/sensearcdb-partition" }
sensearcdb-cq = { path = "crates/sensearcdb-cq" }
sensearcdb-stream = { path = "crates/sensearcdb-stream" }
sensearcdb-derived = { path = "crates/sensearcdb-derived" }
sensearcdb-bench = { path = "crates/sensearcdb-bench" }
sensearcdb-observe = { path = "crates/sensearcdb-observe" }
sensearcdb-deploy = { path = "crates/sensearcdb-deploy" }
sensearcdb-ingest = { path = "crates/sensearcdb-ingest" }
